name: CV workflow

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/README.md'

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      run_en: ${{ steps.decide.outputs.run_en }}
      run_it: ${{ steps.decide.outputs.run_it }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide language builds
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          HEAD_SHA="${{ github.sha }}"

          run_en=false
          run_it=false
          shared=false
          en_locale=false
          it_locale=false

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            run_en=true
            run_it=true
          else
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                makeCV.py|database.py|environment.yml|CV.tex|preamble.tex|publist.tex|talklist.tex|CV.tex.template|preamble.tex.template|publist.tex.template|talklist.tex.template|.github/workflows/main.yml)
                  shared=true
                  ;;
                locales/en.json)
                  en_locale=true
                  ;;
                locales/it.json)
                  it_locale=true
                  ;;
                locales/*.json)
                  shared=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

            if [[ "$shared" == "true" ]]; then
              run_en=true
              run_it=true
            else
              run_en=$en_locale
              run_it=$it_locale
            fi
          fi

          echo "run_en=$run_en" >> "$GITHUB_OUTPUT"
          echo "run_it=$run_it" >> "$GITHUB_OUTPUT"

  build_en:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.run_en == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Conda environment
        id: cache-conda-env
        uses: actions/cache@v4
        with:
          path: |
            ~/conda_pkgs_dir
            /usr/share/miniconda3/envs/buildcv
          key: ${{ runner.os }}-conda-env-${{ hashFiles('environment.yml') }}
          restore-keys: |
            ${{ runner.os }}-conda-env-

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate-base: false
          python-version: '3.11'
          channels: conda-forge,defaults

      - name: Configure conda package cache
        run: conda config --add pkgs_dirs ~/conda_pkgs_dir

      - name: Validate restored conda environment
        id: validate-env
        if: steps.cache-conda-env.outputs.cache-hit == 'true'
        continue-on-error: true
        run: |
          conda run --name buildcv python --version
          conda run --name buildcv python -c "import numpy, scipy"

      - name: Build conda environment (cache miss or invalid cache)
        if: steps.cache-conda-env.outputs.cache-hit != 'true' || steps.validate-env.outcome == 'failure'
        run: |
          conda env update --name buildcv --file environment.yml --prune || \
          conda env create --name buildcv --file environment.yml

      - name: Validate conda environment
        run: conda run --name buildcv python --version

      - name: Generate CV content
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: conda run --name buildcv python makeCV.py --connected --lang en

      - name: Generate short CV
        run: conda run --name buildcv python makeCV.py --short --lang en

      - name: Compile LaTeX documents
        uses: dante-ev/latex-action@latest
        with:
          root_file: CV.tex,publist.tex,talklist.tex,CVshort.tex
          compiler: pdflatex
          args: -interaction=nonstopmode -shell-escape

      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp CV.pdf publist.pdf talklist.pdf CVshort.pdf output/
          cp preamble.tex CV.tex metricspapers.tex metricstalks.tex parsepapers.tex parsetalks.tex parsesupervision.tex parserefereeing.tex parsecodesdata.tex publist.tex talklist.tex CVshort.tex output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-en
          path: output/

  build_it:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.run_it == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Conda environment
        id: cache-conda-env
        uses: actions/cache@v4
        with:
          path: |
            ~/conda_pkgs_dir
            /usr/share/miniconda3/envs/buildcv
          key: ${{ runner.os }}-conda-env-${{ hashFiles('environment.yml') }}
          restore-keys: |
            ${{ runner.os }}-conda-env-

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate-base: false
          python-version: '3.11'
          channels: conda-forge,defaults

      - name: Configure conda package cache
        run: conda config --add pkgs_dirs ~/conda_pkgs_dir

      - name: Validate restored conda environment
        id: validate-env
        if: steps.cache-conda-env.outputs.cache-hit == 'true'
        continue-on-error: true
        run: |
          conda run --name buildcv python --version
          conda run --name buildcv python -c "import numpy, scipy"

      - name: Build conda environment (cache miss or invalid cache)
        if: steps.cache-conda-env.outputs.cache-hit != 'true' || steps.validate-env.outcome == 'failure'
        run: |
          conda env update --name buildcv --file environment.yml --prune || \
          conda env create --name buildcv --file environment.yml

      - name: Validate conda environment
        run: conda run --name buildcv python --version

      - name: Generate CV content
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: conda run --name buildcv python makeCV.py --connected --lang it

      - name: Generate short CV
        run: conda run --name buildcv python makeCV.py --short --lang it

      - name: Compile LaTeX documents
        uses: dante-ev/latex-action@latest
        with:
          root_file: CV.tex,publist.tex,talklist.tex,CVshort.tex
          compiler: pdflatex
          args: -interaction=nonstopmode -shell-escape

      - name: Prepare artifacts
        run: |
          mkdir -p output
          cp CV.pdf publist.pdf talklist.pdf CVshort.pdf output/
          cp preamble.tex CV.tex metricspapers.tex metricstalks.tex parsepapers.tex parsetalks.tex parsesupervision.tex parserefereeing.tex parsecodesdata.tex publist.tex talklist.tex CVshort.tex output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-ita
          path: output/

  deploy_en:
    needs: [detect-changes, build_en]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.run_en == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-en
          path: github_deploy

      - name: Deploy to build branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true

  deploy_it:
    needs: [detect-changes, build_it]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.run_it == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-ita
          path: github_deploy

      - name: Deploy to build_ita branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build_ita
          force_orphan: true
