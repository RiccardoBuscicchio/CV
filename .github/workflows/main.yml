name: CV workflow

# This workflow builds and deploys CV, publication list, and talk list PDFs
# Optimizations:
# - Caches full conda environment to avoid rebuilding on every run
# - Benefits from Docker layer caching for LaTeX compilation
# - See CI_OPTIMIZATION.md for detailed documentation

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:      
    - name: Checkout
      uses: actions/checkout@v7.0.0
    - name: Cache Conda environment
      id: cache-conda-env
      uses: actions/cache@v5.1.0
      with:
        path: |
          ~/conda_pkgs_dir
          /usr/share/miniconda3/envs/buildcv
        key: ${{ runner.os }}-conda-env-${{ hashFiles('environment.yml') }}
        restore-keys: |
          ${{ runner.os }}-conda-env-

    - name: Set up conda
      uses: conda-incubator/setup-miniconda@v4.0.1
      with:
        auto-update-conda: true
        python-version: "3.11"
        activate-environment: buildcv
        environment-file: environment.yml

    - name: Configure conda to use cached pkgs
      run: conda config --add pkgs_dirs ~/conda_pkgs_dir

#    - name: Conda environment
#      run: conda env create --name buildcv --file environment.yml

    - name: Run Python script
      run: conda run --name buildcv bash -c "python makeCV.py --connected --token ${{ secrets.ADS_TOKEN }}"
      
    - name: Run Python script for short CV
      run: conda run --name buildcv bash -c "python makeCV.py --short"

    - name: LaTeX CV
      uses: dante-ev/latex-action@latest
      with:
        root_file: CV.tex
        compiler: pdflatex
        args: -interaction=nonstopmode -shell-escape

    - name: LaTeX publist
      uses: dante-ev/latex-action@latest
      with:
        root_file: publist.tex
        compiler: pdflatex
        args: -interaction=nonstopmode -shell-escape

    - name: LaTeX talklist
      uses: dante-ev/latex-action@latest
      with:
        root_file: talklist.tex
        compiler: pdflatex
        args: -interaction=nonstopmode -shell-escape
    
    - name: LaTeX talklist
      uses: dante-ev/latex-action@latest
      with:
        root_file: CVshort.tex
        compiler: pdflatex
        args: -interaction=nonstopmode -shell-escape
        
    - name: Prepare
      run: |
        mkdir pdfs/
        mkdir texs/
        mv CV.pdf publist.pdf talklist.pdf CVshort.pdf pdfs/
        mv preamble.tex CV.tex metricspapers.tex metricstalks.tex parsepapers.tex parsetalks.tex parsesupervision.tex parserefereeing.tex parsecodesdata.tex publist.tex talklist.tex CVshort.tex pdfs/
            
    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.1
      with:
        name: artifacts
        path: pdfs/

  deploy:
    # Edit here if compiling multiple papers
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    
      - name: Checkout
        uses: actions/checkout@v7.0.0
      
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: pdfs
      
      - name: move
        run: mkdir -p github_deploy && mv pdfs/*/* github_deploy
        
      - name: deploy on orphan branch
        uses: peaceiris/actions-github-pages@v3.1.12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./github_deploy
          publish_branch: build
          force_orphan: true

